# Общие для всех проксируемых адресов заголовки.
#
# Файл вынесен отдельно, потому что эти строки должны быть одинаковыми
# везде: приложение проверяет вход в админку по адресу, который именно
# здесь и передаётся.

proxy_http_version 1.1;
proxy_set_header Host              $host;
proxy_set_header X-Real-IP         $remote_addr;

# Заголовок переписывается целиком, а не дописывается. Если дописывать,
# клиент сможет прислать свой X-Forwarded-For, и приложение возьмёт из
# списка чужой адрес — ограничение по адресу перестанет работать.
proxy_set_header X-Forwarded-For   $remote_addr;
proxy_set_header X-Forwarded-Proto $scheme;

proxy_redirect off;
proxy_read_timeout 60s;
proxy_connect_timeout 10s;
