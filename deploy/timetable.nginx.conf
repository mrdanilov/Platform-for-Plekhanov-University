# nginx перед приложением: TLS, статика и ограничение админки.
#
# Смысл разделения: gunicorn слушает только 127.0.0.1 и напрямую из
# интернета недоступен. Всё, что снаружи, идёт через nginx.

upstream timetable {
    server 127.0.0.1:8000;
}

server {
    listen 80;
    listen [::]:80;
    server_name example.com www.example.com;

    # Обычный http используется только для выпуска сертификата.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name example.com www.example.com;

    ssl_certificate     /etc/letsencrypt/live/example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/example.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy same-origin always;

    client_max_body_size 8m;

    # --- админка ------------------------------------------------------------
    # Второй замок, кроме проверки в приложении. Если приложение почему-то
    # запустят без nginx (или с чужим), этот блок всё равно не пустит.
    location /admin/ {
        allow 10.0.0.0/8;
        allow 172.16.0.0/12;
        allow 192.168.0.0/16;
        allow 127.0.0.1;
        deny all;
        proxy_pass http://timetable;
        include /etc/nginx/snippets/timetable-proxy.conf;
    }

    location /admin {
        return 301 /admin/;
    }

    # --- статика ------------------------------------------------------------
    # Отдаётся nginx, мимо приложения: дешевле и не занимает worker.
    location /static/ {
        alias /var/www/timetable-static/;
        expires 30d;
        add_header Cache-Control "public";
        access_log off;
    }

    location / {
        proxy_pass http://timetable;
        include /etc/nginx/snippets/timetable-proxy.conf;
    }
}
